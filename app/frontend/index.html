<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          // Theme initialization
          var theme = localStorage.getItem('theme') || 'dark';
          var activeTheme = 'dark';
          if (theme === 'system') {
            activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            activeTheme = theme;
          }
          document.documentElement.classList.add(activeTheme);

          // Language / RTL initialization
          var lang = localStorage.getItem('language') || 'en';
          var dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.dir = dir;
          document.documentElement.lang = lang;
          if (lang === 'ar') {
            document.documentElement.classList.add('rtl-layout');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/orkest-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orkest - Intelligent Team Orchestration Platform</title>
    <meta name="description" content="AI-powered project management and team orchestration platform. Plan smarter, collaborate better, deliver faster." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
